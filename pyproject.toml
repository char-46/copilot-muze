[project]
name = "copilot-muze"
description = "Personal QQ copilot: message archive, roaming backfill, multimodal assistant. Speaks the Milky protocol (LLBot / Lagrange.Milky) and reserves a provider seam for raw Lagrange."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "muze" }]
# Pre-release is bumped per feature commit; build metadata (git sha, build time)
# is appended at runtime by muze.version.get_version().
version = "0.1.0a93"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "openai>=1.40",
    "python-docx>=1.1",
    "pillow>=12.3.0",
    "pilk>=0.2.4",
    "sqlite-vec>=0.1.9",
    "markdown>=3.6",
    "pymupdf>=1.24",
    "fonttools>=4.50",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-pptx>=0.6",
    "py7zr>=0.21",
    "rarfile>=4.2",
]

[project.scripts]
muze = "muze.__main__:main"

[project.optional-dependencies]
# local Qwen embeddings (torch) + GPU/CPU + power/idle probes
rag-local = ["sentence-transformers>=3.0", "torch>=2.2", "psutil>=5.9", "nvidia-ml-py>=12"]
# lightweight ONNX alternative (no torch)
rag-onnx = ["fastembed>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# Windows torch comes from the PyTorch CUDA index (the PyPI default is a
# CPU-only build — GPU embedding never engages with it). The +cu130 wheels
# still run fine on CPU-only machines, they are just a bigger download.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muze"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
