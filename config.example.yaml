# copilot-muze configuration (v2 layout, breaking change since 0.1.0-alpha.27)
# Copy to config.yaml and adjust. `config.yaml` is gitignored.
#
# Layout:
#   application-level : web / log / storage.data_dir / ingest / llm / digest
#   control           : who may command (controller) and where (control_group)
#   accounts          : protocol sources, one entry per login. Data dirs are
#                       derived automatically per QQ number: <data_dir>/<uin>/
#                       (muze.db), so accounts never mix; media bytes live in
#                       the shared deduped blob store <data_dir>/blobs/.
#
# Top-level sections act as shared defaults; each account entry deep-merges
# its overrides over them (e.g. its own digest/control/llm), except `web`
# which is app-level only.
#
# Command / LLM isolation (how the controller talks to the copilot):
#   /command   -> command (group: @bot or bare — bare answered by the
#                primary bot only, so N bots in one group never all reply)
#   ::message  -> sent to the LLM (two colons, half/full width both work)
#   other text -> archived only, never answered

accounts:
  milky:                      # LLBot / Lagrange.Milky serving the Milky protocol
    - name: main              # optional display name (console /use, webui selector)
      base_url: http://127.0.0.1:8080
      access_token: ""
      reconnect_interval: 5   # seconds between WS reconnect attempts
      request_timeout: 30     # seconds for HTTP API calls
      # controller: [10001]   # extra controllers for this account (unions global)
      # digest: {enabled: false}   # example per-account override
    # - name: alt             # second account in the same process
    #   base_url: http://127.0.0.1:8081
    #   access_token: ""
  ob11: []                    # reserved: OneBot 11 sources (not implemented yet)
  lagrange: []                # reserved: native Lagrange sources (not implemented yet)

storage:
  data_dir: ./data            # root; per account: <dir>/<QQ>/muze.db; media: <dir>/blobs/ (shared, deduped)

ingest:
  # all      -> every friend chat and every group is archived + backfilled
  # watchlist-> only conversations in watchlist (control chats always ingested)
  scope: all
  watchlist:
    friends: []               # e.g. [10001, 10002]
    groups: []                # e.g. [123456789]
  backfill:
    on_start: true            # roaming pull at startup
    max_pages_per_conv: 200   # hard stop per conversation (page = up to page_limit msgs)
    page_limit: 30            # Milky max is 30
    page_delay: 1.0           # seconds between pages (rate-limit safety)
    conv_delay: 0.5           # seconds between conversations
    concurrency: 2            # conversations pulled in parallel (1 = sequential)
    rescan_interval_min: 30   # periodic rescan (catches self-sent + missed events); 0 = off
    rescan_active_window_h: 24  # rescan only conversations active within this window
    rescan_full_daily: true     # once a day sweep EVERY conversation (quiet chats heal too)
    rescan_full_at: "00:05"     # local HH:MM -- keep before digest.at so the dream sees a full day
    reconnect_gap_sec: 60     # after a drop longer than this, reconnect triggers an immediate catch-up pull
    # --- anti-ban pacing ---
    jitter_pct: 0.5           # randomize page/conv delays by +-50% (bot fingerprint avoidance)
    daily_page_budget: 4000   # whole-process page pulls per day; 0 = off. Spent budget stops
                              # pulls until tomorrow (manual /sync force bypasses)
    fail_streak_limit: 5      # consecutive failed pages before ALL pulls back off
    risk_backoff_sec: 900     # backoff step; doubles per additional trip...
    risk_backoff_max_sec: 86400  # ...up to a day. Errors that smell like risk control
                              # (风控/冻结/too many...) trip the backoff IMMEDIATELY
  media_download_concurrency: 3
  media_transcode_silk: true  # decode SILK voice to a playable .wav (raw .silk kept too)

  # --- perception (background, never blocks ingestion) ---
  asr:
    enabled: true
    provider: auto            # auto | api | qwen | local | qq | "" (off)
                              # api  -> llm.models entry routed via llm.roles.asr
                              #         (any OpenAI-compatible /audio/transcriptions:
                              #          whisper-1, SenseVoice, ...)
                              # qwen -> LOCAL Qwen3-ASR (uv sync --extra asr-qwen);
                              #         52 languages + 22 Chinese dialects, beats
                              #         whisper-large on zh; add the aligner below
                              #         and every clip also gets per-word
                              #         timestamps (media.asr_ts, schema v13)
                              # local-> faster-whisper on CPU (optional dep:
                              #          uv add faster-whisper)
                              # qq   -> reserved: the protocol side has no
                              #         transcription API today
                              # auto -> api if configured, else qwen, else local
    language: zh
    max_per_pass: 8           # clips transcribed per enrichment pass
    local_model: small        # faster-whisper size (tiny/base/small/...)
    min_duration_sec: 1.0     # shorter clips are skipped
    # --- qwen backend ---
    qwen_model: Qwen/Qwen3-ASR-0.6B       # hf id or local dir (1.7B = better)
    aligner_model: Qwen/Qwen3-ForcedAligner-0.6B  # "" = no timestamps
    timestamps: true          # keep per-word timings via the aligner
    qwen_device: auto         # auto (GPU when VRAM fits, else CPU) | cuda | cpu
    qwen_gpu_weight_gb: 3.4   # ASR + aligner bf16 VRAM estimate
    qwen_unload_idle_sec: 1800  # release weights after this idle (0 = never)
  ocr:
    enabled: true
    provider: auto            # auto | local | llm | "" (off)
                              # local-> rapidocr-onnxruntime (optional dep:
                              #          uv add rapidocr-onnxruntime)
                              # llm  -> the ocr role chain (multimodal reads it)
                              # auto -> local if importable, else llm
    max_per_pass: 8           # images per pass
    min_text_chars: 4         # shorter results = "no text" (photos stay photos)
  value:
    enabled: true             # cheap model scores messages 0..3 (value role)
    batch_size: 40            # messages per LLM call
    per_pass: 200             # per loop pass
    lookback_days: 3          # only recent history gets scored
    rag_min_value: 1          # RAG chat windows skip messages scored below this
                              # (NULL=unjudged keeps indexing; 0 = filter off)

control:
  controller: [10000]         # controller QQ uins allowed to command the copilot (who)
  control_group: 0            # group id used as control room; 0 = disabled (where)
  private_control: true       # controller may command via private chat
  confirm_timeout_min: 30     # pending approvals expire after this
                              # (writes outside the control session are always
                              #  routed to the controller for approval)

llm:
  chat:                       # any OpenAI-compatible endpoint (GLM / DeepSeek / MiMo ...)
    base_url: https://open.bigmodel.cn/api/paas/v4/
    api_key: ""
    model: glm-4.7
    temperature: 0.4
    # timeout is a STREAM-STALL limit: max silence between chunks. A slow
    # model keeps producing chunks and is never cut; a stuck one is dropped.
    timeout: 120
  vision:                     # multimodal model for images; empty model disables vision
    base_url: ""              # empty -> reuse chat.base_url / chat.api_key
    api_key: ""
    model: ""                 # e.g. glm-4v-plus

  # --- multi-model registry. Two layers:
  #   1) the PYTHON catalog (preferred for anything with pricing/caps):
  #      <data_dir>/models.py — capability declarations (vision/tools/asr)
  #      and PRICING FUNCTIONS (peak/off-peak 峰谷, per-image, per-audio-minute).
  #      Copy models.example.py. Entries activate once a key is supplied
  #      here (llm.models.<name>.api_key) or via MUZE_KEY_<NAME>.
  #   2) plain entries below (no pricing; caps/rpm inline) — still fully
  #      supported, and they override catalog fields of the same name.
  models:
    # deepseek:
    #   api_key: ""              # the only required field for a catalog entry
    #   rpm: 30               # requests/min cap, process-wide (0 = off)
    #   max_concurrency: 4    # in-flight cap (0 = off)
    #   # caps/base_url/model default to the catalog's; override as needed
    # glm-v:
    #   base_url: https://open.bigmodel.cn/api/paas/v4/
    #   api_key: ""
    #   model: glm-4v-plus
    #   caps: {vision: true}
  catalog: ""                  # "" -> <data_dir>/models.py; a path; or "off"

  # --- async Batch API lane (llm.batch): ~50% cheaper (Pricing.batch_factor),
  # answered within 24h. For delay-tolerant loads only — currently value
  # scoring: with >= min_requests unjudged messages, one /v1/batch job
  # replaces the inline scoring rounds (rows marked value=-1 while in
  # flight; a dead job auto-resets them to the inline path). Interactive
  # turns NEVER batch. Provider must support /v1/batch + /v1/files
  # (OpenAI, DeepSeek, SiliconFlow, GLM async all do).
  batch:
    enabled: false
    min_requests: 50          # inline below this backlog, batch above
    max_requests: 2000        # one batch file's request cap
    poll_interval_sec: 600    # completion polling cadence
    completion_window: 24h
    role: value               # role chain used for batch submissions

  roles:
    # chat:   [chat]              # the agent / converse loop
    # vision: [glm-v, chat]       # image understanding
    # value:  [cheap, chat]       # bulk scoring (message value recognition)
    # digest: [cheap, chat]       # nightly dreaming / profiles
    # ocr:    [ocr, glm-v, chat]  # future ocr chain
    # asr:    [asr]               # future asr chain
  prefix: "::"                # wake prefix for LLM chat (half/full-width colons both match)

  agent_max_steps: 48        # tool-calling rounds per run; hitting it SUSPENDS the turn (resume with /sess go)
  turn_timeout_sec: 300      # STALL cap: a tool round stuck this long is aborted (slow-but-progressing turns are never cut)
  max_concurrent_turns: 4    # turns talking to the model at once (per account); a chat can hold several :: sessions
  max_queued_turns: 8        # extra turns allowed to wait for a slot; beyond this the turn is refused with 忙
  auto_title: true           # summarize a short title per session for /sess list (one cheap extra LLM call)
  progress: true             # in-turn feedback: "still waiting" heartbeats + tool-call lines
  progress_wait_sec: 20      # silence before the first heartbeat (fast answers send nothing)
  progress_interval_sec: 60  # between subsequent heartbeats
  asr_provider: ""            # reserved (voice transcription lands later)

web:                          # app-level: one webui serves every account
  enabled: true
  host: 127.0.0.1
  port: 8300
  token: ""                   # "" -> random token generated and logged at startup;
                              # SET A FIXED VALUE so you paste it into the webui only once
                              # (a random one changes on every restart and must be re-copied
                              #  from the log -- old log lines then stop working)
  # tunnel:                   # ssh reverse tunnel through a relay box, for
  #   enabled: true           # `muze cli --remote` + shells + port
  #   host: relay.example.com # forwarding from a dev machine with no route
  #   port: 22                # here. The relay is configured ONCE: install
  #   user: root              # the shared key's public half as ONE
  #   key_file: ""            # authorized_keys line:
  #   remote_host: 127.0.0.1  #   restrict,port-forwarding,command="/bin/false",
  #   remote_port: 18300      #   permitopen="127.0.0.1:1",
  #   forwards:               #   permitlisten="127.0.0.1:*" <pubkey>
  #     - local_port: 8300    # (forward-only: no shell/pty/pivot, loopback
  #       remote_port: 18300  #  binds only). EVERY box then reuses the SAME
  #     - local_port: 22      # private key (default: <data_dir>/.ssh/
  #       remote_port: 18301  #  muze_tunnel) and claims its OWN remote_port
                              #  range (box1: 1830x, box2: 1831x, ...) so
                              #  tunnels never collide. forwards:[]
                              #  defaults to webui-only via remote_port.
  #   token: ""               # INDEPENDENT bearer token for remote access:
                              # the local browser keeps web.token, muze cli
                              # --remote uses this one; rotate separately

# remote:                     # DEV MACHINE side of `muze cli --remote` (args
#   url: http://127.0.0.1:8300   # and MUZE_REMOTE_* env win over this section)
#   token: ""                 # webui bearer token of the upstream instance
#   account: ""               # pick an account on multi-account upstreams
#   timeout: 600

research:                     # web search for the agent's research closure
  provider: ""                # tavily | brave | serper | searxng | duckduckgo | "" (off)
  api_key: ""                 # for tavily/brave/serper
  base_url: ""                # searxng instance URL (e.g. http://localhost:8888); optional override
  max_results: 5
  fetch_chars: 4000           # per-page extract kept by research()
  timeout: 20

digest:
  # Nightly "dream": summarize each passed day (fixed 01:00), catch up
  # missing days automatically, roll completed weeks/months into compressed
  # reports (hierarchical memory), and distill long-term memories about the
  # user and their contacts (fed back into the agent's prompts).
  enabled: true
  at: "01:00"               # local time
  top_conversations: 0      # 0 = EVERY active conversation gets a section
                            # (N = only the busiest N, not recommended)
  messages_per_conversation: 0  # 0 = unlimited, even-sampled within budget
                            # (N = hard per-conversation cap)
  transcript_chars: 48000   # global transcript budget fed to the LLM; over
                            # budget -> per-conversation even sampling that
                            # keeps first+last messages, never drops a conv
  prior_days: 7             # feed the previous N day reports into each
                            # digest for follow-ups (0 = isolated days)
  prior_week: true          # also feed the latest weekly rollup (threads
                            # older than the day window live in there)
  prior_chars: 1600         # per prior-report truncation
  rag_context: true         # per-conversation semantic recall over past
                            # summaries (needs rag.enabled + embedding)
  rag_conversations: 8      # busiest conversations getting a retrieval
  rag_hits: 3               # hits per conversation
  rag_chars: 200            # chars per hit
  deliver: true             # send the report to the control conversation

  # structured follow-ups: "需要处理" items live in the followups table,
  # synced by the nightly dream; close them with /done (the completion
  # signal) or let them auto-expire
  followup_extract: true
  followup_expire_days: 14 # open items untouched this long auto-expire

  # owner personalization: identity/priority memories steer report ordering
  # (e.g. "研究生+兼职辅导员，本科事务非首要" demotes undergrad noise)
  owner_context: true
  # morning briefing: at dawn push yesterday's digest to the admins.
  # Targets default to every controller (private) + the control group;
  # override with explicit entries ("friend/123" | "group/456").
  morning_enabled: true
  morning_at: "06:00"
  # morning_targets: ["friend/10000", "group/20002"]
  extract_memories: true    # second LLM pass: distill identity/preferences
  max_memories_per_night: 8
  weekly_enabled: true      # roll up completed weeks (2026-W40 style reports)
  monthly_enabled: true     # roll up completed months (2026-09 style reports)
  inject_context: true      # feed latest day/week/month reports into every agent prompt
  inject_day_chars: 900
  inject_week_chars: 450
  inject_month_chars: 450
  inject_max_memories: 25

reply:                          # outbound QQ replies: full text, QQ-safe form
  # >5000 chars: merged-forward chain carries the COMPLETE text (no more
  # truncation); 0 = off (then long replies send as sequential messages)
  forward_chars: 5000
  node_chars: 500              # per-node cap inside the chain (chat-sized nodes)
  strip_markdown: true         # QQ text is plain: strip md markers
  image_markdown: true         # send the rendered (formatted) image along -
                               # 图文 with the plain text; rendering uses
                               # bundled CJK fonts; drop MapleMono*.ttf or
                               # LxgwWenKai*.ttf into data/fonts/ to override
  image_max_chars: 80000       # render at most this much source text
  render_font: ""              # explicit font file path; empty = auto
  # PDF export reuses the same renderer: /topdf (quote a message) and
  # /sess getpdf <id>; markdown is auto-detected per document.

profiles:                     # per-conversation identity docs ("who is who")
  auto: true                  # periodically (re)build them from recent chats
  interval_min: 360           # refresh cadence
  active_window_h: 48         # only conversations active within this window
  messages_per_conv: 120
  max_chars: 1200
  inject: true                # add a compact "who is who" index to agent prompts
  inject_chars: 80

rag:                          # vector retrieval over summaries (+ optional chats)
  enabled: false              # master switch; needs a usable rag.embedding
  chat: false                 # ALSO index chat message windows (opt-in)
  top_k: 6
  window_messages: 12
  window_chars: 900
  index_interval_min: 5       # background indexing cadence (still gated)
  auto_inject: true           # retrieve semantic hits per incoming message
  inject_k: 5                 # hits injected per message
  inject_chars: 300           # chars per injected hit
  require_ac_power: true      # only index on AC power (needs psutil battery)
  idle_cpu_pct: 40            # only while CPU busy% is below this
  min_idle_sec: 30            # and no user activity for this long
  embedding:
    provider: auto            # auto (local-first, remote fallback if configured) | local | openai
    backend: st               # st (sentence-transformers/torch, Qwen) | fastembed (ONNX)
    model: Qwen/Qwen3-Embedding-0.6B   # local model (install: uv sync --extra rag-local)
    query_instruction: ""     # optional instruction prefix for queries
    device: auto              # auto (tiered: GPU if VRAM fits & GPU idle, else CPU) | cuda | cpu
    gpu_weight_gb: 1.6        # VRAM the model needs (0.6B fp16 + overhead)
    gpu_reserve_gb: 0.8       # comfortable headroom; tight VRAM may squeeze without it
    gpu_max_util: 50          # use GPU only while its utilisation is below this
    cpu_max_threads: 4        # cap for CPU inference (scaled down when busy)
    batch: 16
    min_interval_sec: 0.05    # pause between local batches
    max_retries: 3            # local failures before the cooldown
    cooldown_sec: 300         # back-off after repeated failure
    unload_idle_sec: 1800     # release the local model after this idle (0=never)
    remote_model: ""          # set to ENABLE the OpenAI-compatible fallback
    base_url: ""              # empty -> reuse llm.chat.base_url
    api_key: ""               # empty -> reuse llm.chat.api_key
    dims: 0                   # 0 = infer from the first embedding

log:
  level: INFO                 # DEBUG for verbose protocol traffic
  file: ""                    # empty -> data_dir/logs/muze.log (appended, never rotated)
