<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muze · QQ copilot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">muze <span id="version" class="dim"></span></div>
  <select id="acctSel" class="hidden" title="账号"></select>
  <div id="statusdot" class="dot off" title="API 状态"></div>
  <input id="token" type="password" placeholder="access token" autocomplete="off">
  <button id="saveToken">保存</button>
</header>

<nav>
  <button data-tab="chats" class="active">会话</button>
  <button data-tab="search">搜索</button>
  <button data-tab="ai">AI</button>
  <button data-tab="memories">记忆</button>
  <button data-tab="rag">RAG</button>
  <button data-tab="pending">待确认 <span id="pendingBadge" class="badge hidden">0</span></button>
  <button data-tab="settings">设置</button>
  <button data-tab="logs">日志</button>
  <button data-tab="status">状态</button>
</nav>

<main>
  <!-- chats -->
  <section id="tab-chats" class="tab active">
    <div class="split">
      <div id="convlist" class="pane list"><div class="dim pad">加载中…</div></div>
      <div id="msgpane" class="pane grow">
        <div id="msghead" class="panehead dim pad">选择左侧会话</div>
        <div id="msglist" class="msglist"></div>
        <button id="older" class="block">加载更早消息</button>
      </div>
    </div>
  </section>

  <!-- search -->
  <section id="tab-search" class="tab">
    <div class="bar">
      <input id="searchq" placeholder="关键词…">
      <button id="searchBtn">搜索</button>
    </div>
    <div id="searchresults"></div>
  </section>

  <!-- ai: session-based chat -->
  <section id="tab-ai" class="tab">
    <div class="split">
      <div id="ailist" class="pane list">
        <div class="bar slim">
          <input id="aiFilter" placeholder="过滤会话…">
          <button id="aiNew" title="开始新对话">＋</button>
        </div>
        <div id="aisses" class="sesslist"><div class="dim pad">加载中…</div></div>
      </div>
      <div id="aipane" class="pane grow">
        <div id="aihead" class="panehead dim pad">新对话</div>
        <div id="aichat" class="aichat"></div>
        <button id="aijump" class="jump hidden">↓ 有新内容</button>
        <div class="composer">
          <textarea id="aiinput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
          <button id="aiSend">发送</button>
        </div>
      </div>
    </div>
  </section>

  <!-- memories -->
  <section id="tab-memories" class="tab">
    <div class="bar">
      <input id="memq" placeholder="搜索长期记忆（留空列出全部）">
      <button id="memBtn">搜索</button>
    </div>
    <div id="memlist"><div class="dim pad">加载中…</div></div>
  </section>

  <!-- rag -->
  <section id="tab-rag" class="tab">
    <div id="ragstate" class="bar"><span class="dim">加载中…</span></div>
    <div class="bar">
      <input id="ragq" placeholder="语义检索，如：谁抱怨过加班">
      <select id="ragKind">
        <option value="">全部类型</option>
        <option value="profile">身份档案</option>
        <option value="memory">长期记忆</option>
        <option value="digest">做梦报告</option>
        <option value="chat">聊天窗口</option>
      </select>
      <button id="ragBtn">检索</button>
    </div>
    <div id="ragresults"></div>
  </section>

  <!-- pending -->
  <section id="tab-pending" class="tab">
    <div id="pendinglist"><div class="dim pad">加载中…</div></div>
  </section>

  <!-- settings -->
  <section id="tab-settings" class="tab">
    <div class="bar">
      <span class="dim">快速配置（运行时生效；持久化请编辑 config.yaml 后 /reload）</span>
      <button id="cfgSave">保存生效</button>
    </div>
    <div id="settingsForm" class="settings"><div class="dim pad">加载中…</div></div>
  </section>

  <!-- logs -->
  <section id="tab-logs" class="tab">
    <div class="bar">
      <button id="logRefresh">刷新</button>
      <span class="dim" id="logpath"></span>
    </div>
    <pre id="logview" class="logview"></pre>
  </section>

  <!-- status -->
  <section id="tab-status" class="tab">
    <pre id="statusview" class="logview"></pre>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
